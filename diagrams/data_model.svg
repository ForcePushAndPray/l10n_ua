@startuml data_model
skinparam backgroundColor #FEFEFE
skinparam linetype ortho

title Модель даних HR Ukraine

entity "hr.employee" as employee {
    * id : integer
    - -
    * name : char
    rnokpp : char
    passport_id : char
    - -
    department_id : FK
    job_id : FK
}

entity "hr.contract" as contract {
    * id : integer
    - -
    * employee_id : FK
    * date_start : date
    * wage : monetary
}

entity "hr.order" as order {
    * id : integer
    - -
    * name : char
    * order_type : selection
    content : html
    - -
    employee_id : FK
}

entity "hr.order.template" as template {
    * id : integer
    - -
    * name : char
    * order_type : selection
    body : html
}

entity "hr.certificate" as certificate {
    * id : integer
    - -
    * certificate_type_id : FK
    * employee_id : FK
    body : html
    state : selection
}

entity "hr.certificate.type" as cert_type {
    * id : integer
    - -
    * name : char
    * code : char
    template_body : html
}

employee ||- -o{ contract
employee ||- -o{ order
employee ||- -o{ certificate

order }o- -|| template
certificate }o- -|| cert_type

@enduml

