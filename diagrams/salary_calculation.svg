@startuml salary_calculation
skinparam backgroundColor #FEFEFE

title Розрахунок заробітної плати

start

:Оклад за посадою;

:+ Надбавки;

:= Нарахування (Gross);

if (Дохід <= Ліміту ПСП?) then (так)
    :- ПСП;
else (ні)
    :ПСП не застосовується;
endif

:= База ПДФО;

:x 18% = ПДФО;

:x 5% = Військовий збір;

:- Інші утримання;

:= До виплати (Net);

stop

@enduml

